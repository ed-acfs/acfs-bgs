# Publishes the tool on GitHub Pages (https://flottastellare.it/bgs-tool/) with fresh Spansh
# data: on every push to main, every hour (Spansh fills in as players fly through systems
# after the tick), and by hand from the Actions tab.
#
# GitHub disables scheduled workflows in a public repo after 60 days without commits; if
# the data stops updating, re-enable it from the Actions tab.
name: Pubblica su GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued one waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Code only changes on push; the hourly refresh skips the tests.
      - if: github.event_name != 'schedule'
        run: npm run test:scripts
      - if: github.event_name != 'schedule'
        run: npm test -- --watch=false
      - name: Download the Spansh data
        run: npm run fetch-data
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/bgs-tool/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
