<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>ACFS BGS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      name="description"
      content="Tool BGS di Alto Comando Flotta Stellare per Elite Dangerous: influenza della fazione Flotta Stellare, stati, priorità di intervento e architetti dei sistemi."
    />

    <style>
      /* The app's global styles only load after bootstrap, so give the document a height
         here — otherwise the height:100% splash wrapper collapses and the centred logo
         is pulled off the top of the viewport. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #1c1c1c;
      }
    </style>
  </head>
  <body>
    <app-root>
      <div style="position: relative; height: 100%; width: 100%">
        <div
          style="
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
          "
        >
          <img src="assets/acfs-logo.png" alt="" style="width: 120px; height: 120px" />
          <noscript>
            <span style="color: #fff"> Per usare questa applicazione serve JavaScript. </span>
          </noscript>
        </div>
      </div>
    </app-root>
  </body>
</html>
